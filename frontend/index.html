<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Assistant</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
        .colorful-bg {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="colorful-bg min-h-screen text-slate-100 flex flex-col items-center justify-start py-12 px-4">

    <!-- Main Container -->
    <div class="w-full max-w-2xl bg-slate-900/40 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 shadow-2xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="px-3.5 py-1.5 rounded-full bg-amber-500/10 text-amber-400 text-xs font-semibold border border-amber-500/20 inline-block mb-3">
                ✨ Welcome to AI Task Assistant
            </span>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">Your Smart Task Planner</h1>
            <p class="text-slate-400 text-sm md:text-base">Transform any complex task into clear, actionable daily steps instantly.</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="e.g., Learn Python in 30 days or Build a web app" 
                class="flex-1 bg-slate-950/60 border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
            >
            <button 
                id="generateBtn" 
                onclick="generateSteps()" 
                class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold px-6 py-3.5 rounded-2xl transition shadow-lg shadow-indigo-500/25 cursor-pointer"
            >
                Generate
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-2">Generating your smart action plan...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-2xl text-sm mb-6"></div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-4"></div>

    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-xs text-slate-500">
        Powered by FastAPI & OpenRouter Free AI
    </div>

    <script src="script.js"></script>
</body>
</html>
