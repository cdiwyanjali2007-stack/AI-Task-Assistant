    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Smart Task Planner</title>
    
    <!-- Place the favicon link right here inside the head section -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Your existing body content goes here -->
    
    <script src="script.js"></script>
</body>
</html>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animated Colorful Gradient Background */
        .colorful-bg {
            background: linear-gradient(-45deg, #ff007f, #7928ca, #4f46e5, #06b6d4, #eab308);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="colorful-bg min-h-screen text-slate-100 flex flex-col items-center justify-start py-12 px-4">

    <!-- Main Container with Glassmorphism -->
    <div class="w-full max-w-2xl bg-slate-950/40 backdrop-blur-2xl border border-white/30 shadow-[0_0_50px_rgba(0,0,0,0.5)] rounded-3xl p-8 transition-all duration-300">
        
        <!-- Header with Welcome Message -->
        <div class="text-center mb-8">
            <span class="inline-block bg-white/20 border border-white/30 text-yellow-300 text-xs font-bold px-4 py-1.5 rounded-full mb-3 shadow-sm backdrop-blur-md">
                👋 Welcome to AI Task Assistant
            </span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2 drop-shadow-md">
                Your Smart Task Planner
            </h1>
            <p class="text-indigo-100 text-sm font-medium">Transform any complex task into clear, actionable daily steps instantly.</p>
        </div>

        <!-- Input Form -->
        <div class="flex flex-col sm:flex-row gap-3 mb-8">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="e.g., Learn Python in 30 days, Launch a startup..." 
                class="flex-1 bg-slate-900/70 border border-slate-600 focus:border-pink-500 focus:ring-2 focus:ring-pink-500/40 text-white placeholder-slate-400 rounded-xl px-5 py-3.5 outline-none transition-all shadow-inner"
            >
            <button 
                id="generateBtn"
                onclick="generateSteps()" 
                class="bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 active:scale-95 text-white font-bold px-7 py-3.5 rounded-xl shadow-lg shadow-purple-600/40 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer border border-white/20"
            >
                <span>Generate</span>
            </button>
        </div>

        <!-- Loading State (Hidden by default) -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-10 space-y-3">
            <div class="w-10 h-10 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-pink-200 text-sm font-semibold animate-pulse">AI is crafting your colorful roadmap...</p>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="errorMessage" class="hidden bg-rose-500/20 border border-rose-500/40 text-rose-200 px-4 py-3 rounded-xl mb-6 text-sm text-center font-medium"></div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-4">
            <!-- Steps will be injected here dynamically -->
        </div>

    </div>

    <!-- Footer Credit -->
    <footer class="mt-8 text-white/70 text-xs font-medium tracking-wide">
        Powered by FastAPI & OpenRouter Free AI
    </footer>

    <!-- Link to JavaScript -->
    <script src="script.js"></script>
</body>
</html>
